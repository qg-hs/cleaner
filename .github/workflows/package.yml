name: Build & Package cleaner (macOS M1 / Intel / Universal)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build (${{ matrix.display_name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm64
            archs: "arm64"
            display_name: "Apple Silicon M1/M2/M3/M4 (arm64)"
            artifact_name: "cleaner-macos-arm64"
          - target: x86_64
            archs: "x86_64"
            display_name: "Intel (x86_64)"
            artifact_name: "cleaner-macos-x86_64"
          - target: universal
            archs: "arm64 x86_64"
            display_name: "Universal (arm64 + x86_64)"
            artifact_name: "cleaner-macos-universal"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & macOS environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Install CocoaPods dependencies
        run: |
          if [ ! -d "Pods" ] || ! diff -q Podfile.lock Pods/Manifest.lock >/dev/null 2>&1; then
            pod install --no-repo-update || pod install
          fi

      - name: Build and package (${{ matrix.target }})
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-${{ matrix.target }}
          DIST_DIR: ${{ runner.temp }}/dist-${{ matrix.target }}
        run: |
          chmod +x ./scripts/package.sh
          ./scripts/package.sh "${{ matrix.target }}"

      - name: Upload ${{ matrix.display_name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ runner.temp }}/dist-${{ matrix.target }}/cleaner-macos-${{ matrix.target }}.dmg
            ${{ runner.temp }}/dist-${{ matrix.target }}/cleaner-macos-${{ matrix.target }}.zip
            ${{ runner.temp }}/dist-${{ matrix.target }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Consolidate release files & SHA256SUMS
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.dmg" -o -name "*.zip" \) -exec cp {} dist/ \;
          cat release-assets/*/SHA256SUMS.txt > dist/SHA256SUMS.txt
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cleaner-macos-arm64.dmg
            dist/cleaner-macos-arm64.zip
            dist/cleaner-macos-x86_64.dmg
            dist/cleaner-macos-x86_64.zip
            dist/cleaner-macos-universal.dmg
            dist/cleaner-macos-universal.zip
            dist/SHA256SUMS.txt
