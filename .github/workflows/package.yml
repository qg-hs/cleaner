name: Build & Package cleaner (macOS M1 / Intel / Universal)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package All Architectures
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & macOS environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Install CocoaPods dependencies
        run: |
          if [ ! -d "Pods" ] || ! diff -q Podfile.lock Pods/Manifest.lock >/dev/null 2>&1; then
            pod install --no-repo-update || pod install
          fi

      - name: Build and package all architectures (arm64 / x86_64 / universal)
        env:
          DIST_DIR: ${{ github.workspace }}/dist
        run: |
          chmod +x ./scripts/package.sh
          ./scripts/package.sh all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleaner-all-dist
          path: |
            dist/cleaner-macos-*.dmg
            dist/cleaner-macos-*.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cleaner-macos-arm64.dmg
            dist/cleaner-macos-arm64.zip
            dist/cleaner-macos-x86_64.dmg
            dist/cleaner-macos-x86_64.zip
            dist/cleaner-macos-universal.dmg
            dist/cleaner-macos-universal.zip
            dist/SHA256SUMS.txt
